[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name: "logsift" is already taken by an unrelated
# project, so this is published as "accesslog-sift". The installed command
# is unaffected -- it's still `logsift`, set by [project.scripts] below.
name = "accesslog-sift"
version = "0.1.0"
description = "Fast command-line summaries of Apache/Nginx access logs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chad Mowlavie" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["logs", "access-log", "nginx", "apache", "cli", "log-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Log Analysis",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/Chad9100/logsift"
Repository = "https://github.com/Chad9100/logsift"
Issues = "https://github.com/Chad9100/logsift/issues"
Changelog = "https://github.com/Chad9100/logsift/blob/main/ROADMAP.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
logsift = "logsift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
